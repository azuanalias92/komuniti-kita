name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, production]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Hermes-Agent
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Write wrangler.toml from GitHub Variable
        env:
          WRANGLER_TOML: ${{ vars.WRANGLER_TOML }}
        run: |
          echo "$WRANGLER_TOML" > wrangler.toml

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Increment app version in D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Ensure table and default row exist (idempotent on first run)
          yarn wrangler d1 execute komuniti-kita --remote --command "CREATE TABLE IF NOT EXISTS app_version (id INTEGER PRIMARY KEY DEFAULT 1, version INTEGER NOT NULL DEFAULT 0, updated_at TEXT NOT NULL DEFAULT (datetime('now')))"
          yarn wrangler d1 execute komuniti-kita --remote --command "INSERT OR IGNORE INTO app_version (id, version, updated_at) VALUES (1, 0, datetime('now'))"
          # Increment version
          yarn wrangler d1 execute komuniti-kita --remote --command "UPDATE app_version SET version = version + 1, updated_at = datetime('now') WHERE id = 1"
          # Read new version for build (wrangler --json output includes yarn noise, parse carefully)
          RAW=$(yarn wrangler d1 execute komuniti-kita --remote --command "SELECT version FROM app_version WHERE id = 1" --json 2>/dev/null)
          VERSION=$(echo "$RAW" | grep -o '"version":[0-9]*' | head -1 | cut -d: -f2)
          if [ -z "$VERSION" ]; then
            echo "WARNING: Could not read version from D1, falling back to 0"
            VERSION=0
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Incremented app version to: $VERSION"

      - name: Build
        run: yarn build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || '' }}
          VITE_APP_VERSION: ${{ env.APP_VERSION }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy
